<div class="process-page">
  <header class="process-header">
    <div class="process-brand">
      <span class="sali-logo">SALI</span>
      <span class="process-title">Andamento dos Processos</span>
      <span class="badge bg-yellow text-black rounded-pill">beta</span>
    </div>
  </header>

  <main class="process-content">
    <section class="card process-card">
      <div class="card-header border-bottom">
        <h1 class="card-title mb-0">Andamento dos Processos</h1>
      </div>

      <div class="card-body">
        <form *ngIf="!resultadoVisivel" (ngSubmit)="consultar()" class="process-form">
          <div>
            <label for="processo" class="form-label">Processo:</label>
            <input
              id="processo"
              name="processo"
              type="text"
              class="form-control"
              placeholder="Nº do processo"
              [(ngModel)]="processo">
          </div>

          <div>
            <label for="exercicio" class="form-label">Exercício:</label>
            <select
              id="exercicio"
              name="exercicio"
              class="form-select"
              [(ngModel)]="exercicio">
              <option *ngFor="let ano of exercicios" [value]="ano">{{ ano }}</option>
            </select>
          </div>

          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">Consultar</button>
          </div>
        </form>

        <div *ngIf="resultadoVisivel" class="process-form">
          <div>
            <label class="form-label">Processo:</label>
            <input type="text" class="form-control" [value]="processoFormatado" readonly>
          </div>

          <div>
            <label class="form-label">Último trâmite:</label>
            <input type="text" class="form-control" [value]="ultimoTramite" readonly>
          </div>

          <div>
            <label class="form-label">Data último trâmite:</label>
            <input type="text" class="form-control" [value]="dataUltimoTramite" readonly>
          </div>

          <div>
            <label class="form-label">Situação:</label>
            <input type="text" class="form-control" [value]="situacao" readonly>
          </div>

          <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-primary" (click)="novaConsulta()">Nova Consulta</button>
          </div>
        </div>

        <p class="process-helper text-muted mb-0">
          As informações sobre processos são providas pelo Protocolo Geral
        </p>
      </div>
    </section>
  </main>
</div>

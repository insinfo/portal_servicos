<!-- Alert do serviço selecionado -->
<template [ngIf]="servicoSelecionado != null">
  <div class="alert alert-success d-flex align-items-center gap-3 rounded-3 mb-4 py-3 px-4">
    <div class="portal-servico-header-icon bg-white bg-opacity-75 rounded-circle d-flex align-items-center justify-content-center flex-shrink-0">
      <div class="portal-service-icon-svg text-success" [iconMask]="servico.iconFile"></div>
    </div>
    <div>
      <h6 class="fw-bold mb-0 text-body">{{ servico.titulo }}</h6>
      <span class="text-muted fs-sm">{{ servico.descricao }}</span>
    </div>
  </div>
</template>

<!-- Formulário -->
<div class="mb-4">
  <label class="form-label fw-semibold">Endereço da coleta <span class="text-danger">*</span></label>
  <div class="input-group">
    <input type="text" class="form-control" placeholder="Rua das Palmeiras, 123 - Recreio - Rio das Ostras" [(ngModel)]="endereco">
    <button class="btn btn-light border" type="button"><i class="ph ph-magnifying-glass"></i></button>
  </div>
</div>

<div class="mb-4">
  <label class="form-label fw-semibold">Ponto de referência</label>
  <input type="text" class="form-control" placeholder="Em frente à praça do bairro" [(ngModel)]="referencia">
</div>

<div class="mb-4">
  <label class="form-label fw-semibold">Descrição da solicitação <span class="text-danger">*</span></label>
  <textarea class="form-control" rows="4" placeholder="Galhos de poda de árvore em frente à residência." [(ngModel)]="descricaoProblema"></textarea>
  <div class="form-text text-end">{{ descricaoProblema.length }}/500</div>
</div>

<div class="mb-4">
  <label class="form-label fw-semibold">Foto do local (opcional)</label>
  <div class="d-flex flex-wrap gap-3 mt-1">
    <!-- Botão de Upload -->
    <div class="portal-upload-area">
      <i class="ph ph-upload-simple mb-1 fs-3 text-muted"></i>
      <span class="fw-semibold text-body fs-sm">Adicionar foto</span>
      <span class="fs-xs text-muted">Máx. 5 fotos (5MB cada)</span>
    </div>
  </div>
</div>

<!-- Botões de ação -->
<div class="d-flex justify-content-end gap-3 pt-3 border-top">
  <button type="button" class="btn btn-light border px-4" (click)="cancelar()">Cancelar</button>
  <button type="button" class="btn btn-primary px-4" [disabled]="!canAdvance" (click)="enviarPedido()">Enviar solicitação</button>
</div>

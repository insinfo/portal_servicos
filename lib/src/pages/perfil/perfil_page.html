
<div class="row g-4">
  <!-- Profile card -->
  <div class="col-lg-4">
    <div class="card text-center">
      <div class="card-body p-4">
        <div class="bg-primary text-white rounded-pill d-inline-flex align-items-center justify-content-center w-80px h-80px mb-3 fs-1 fw-bold">
          MS
        </div>
        <h6 class="fw-bold mb-1">{{ nome }}</h6>
        <p class="text-muted mb-2 fs-sm">CPF: {{ cpf }}</p>
        <span class="badge bg-success">Conta verificada</span>
      </div>
    </div>

    <!-- Quick stats -->
    <div class="card mt-3">
      <div class="card-body">
        <h6 class="fw-bold mb-3 fs-sm">Resumo</h6>
        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted fs-sm">Total de solicitações</span>
          <span class="fw-semibold">5</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted fs-sm">Concluídas</span>
          <span class="fw-semibold text-success">2</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted fs-sm">Em andamento</span>
          <span class="fw-semibold text-primary">2</span>
        </div>
        <div class="d-flex justify-content-between">
          <span class="text-muted fs-sm">Canceladas</span>
          <span class="fw-semibold text-secondary">1</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Profile form -->
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
        <h6 class="fw-bold mb-0">Dados pessoais</h6>
        <button class="btn btn-sm"
                [class.btn-outline-primary]="!isEditing"
                [class.btn-outline-secondary]="isEditing"
                (click)="toggleEdit()">
          <i [class]="isEditing ? 'ph ph-x' : 'ph ph-pencil-simple'" class="me-1"></i>
          {{ isEditing ? 'Cancelar' : 'Editar' }}
        </button>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold fs-sm">Nome completo</label>
            <input type="text" class="form-control" [(ngModel)]="nome" [readonly]="!isEditing">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold fs-sm">CPF</label>
            <input type="text" class="form-control" [value]="cpf" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold fs-sm">Data de nascimento</label>
            <input type="text" class="form-control" [(ngModel)]="dataNascimento" [readonly]="!isEditing">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold fs-sm">E-mail</label>
            <input type="email" class="form-control" [(ngModel)]="email" [readonly]="!isEditing">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold fs-sm">Telefone</label>
            <input type="text" class="form-control" [(ngModel)]="telefone" [readonly]="!isEditing">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold fs-sm">Endereço</label>
            <input type="text" class="form-control" [(ngModel)]="endereco" [readonly]="!isEditing">
          </div>
        </div>

        <div class="mt-4" *ngIf="isEditing">
          <button class="btn btn-primary"
                  [disabled]="isSaving"
                  (click)="salvar()">
            <i class="ph ph-floppy-disk me-1"></i>
            {{ isSaving ? 'Salvando...' : 'Salvar alterações' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

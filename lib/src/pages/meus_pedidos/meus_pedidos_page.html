
<!-- Stats -->
<div class="row g-3 mb-4">
  <div class="col-6 col-lg-3">
    <div class="card card-body p-3 d-flex flex-row align-items-center gap-3 shadow-none border">
      <div class="bg-primary bg-opacity-10 text-primary rounded-pill d-flex align-items-center justify-content-center flex-shrink-0" style="width: 42px; height: 42px;">
        <i class="ph ph-clipboard-text fs-lg"></i>
      </div>
      <div>
        <h4 class="fw-bold mb-0">5</h4>
        <div class="text-muted fs-xs">Total</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card card-body p-3 d-flex flex-row align-items-center gap-3 shadow-none border">
      <div class="bg-warning bg-opacity-10 text-warning rounded-pill d-flex align-items-center justify-content-center flex-shrink-0" style="width: 42px; height: 42px;">
        <i class="ph ph-magnifying-glass fs-lg"></i>
      </div>
      <div>
        <h4 class="fw-bold mb-0">1</h4>
        <div class="text-muted fs-xs">Em análise</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card card-body p-3 d-flex flex-row align-items-center gap-3 shadow-none border">
      <div class="bg-info bg-opacity-10 text-info rounded-pill d-flex align-items-center justify-content-center flex-shrink-0" style="width: 42px; height: 42px;">
        <i class="ph ph-truck fs-lg"></i>
      </div>
      <div>
        <h4 class="fw-bold mb-0">1</h4>
        <div class="text-muted fs-xs text-nowrap">Em execução</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card card-body p-3 d-flex flex-row align-items-center gap-3 shadow-none border">
      <div class="bg-success bg-opacity-10 text-success rounded-pill d-flex align-items-center justify-content-center flex-shrink-0" style="width: 42px; height: 42px;">
        <i class="ph ph-check-circle fs-lg"></i>
      </div>
      <div>
        <h4 class="fw-bold mb-0">2</h4>
        <div class="text-muted fs-xs">Concluídos</div>
      </div>
    </div>
  </div>
</div>

<!-- Orders list -->
<div class="d-flex flex-column gap-2">
  <div *ngFor="let pedido of pedidos"
       class="card card-body d-flex flex-row align-items-center justify-content-between cursor-pointer mb-0 border-transparent shadow-sm hover-shadow-lg transition-base"
       (click)="verDetalhes(pedido)">
    <div class="d-flex align-items-center gap-3">
      <div class="bg-primary bg-opacity-10 text-primary rounded-pill d-flex align-items-center justify-content-center flex-shrink-0" style="width: 48px; height: 48px;">
        <i [class]="pedido.iconClass + ' fs-xl'"></i>
      </div>
      <div>
        <h6 class="mb-0 fw-semibold text-body">{{ pedido.servico }}</h6>
        <small class="text-muted">Protocolo: {{ pedido.protocolo }} &middot; {{ pedido.data }}</small>
      </div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span [class]="pedido.statusClass" class="badge">{{ pedido.status }}</span>
      <div class="text-muted bg-light rounded-pill p-1 d-flex">
        <i class="ph ph-caret-right"></i>
      </div>
    </div>
  </div>
</div>

name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Dart 🎯
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.6.2

      - name: Install dependencies 📦
        run: dart pub get

      - name: Build 🏗️
        run: |
          dart run build_runner build --release --delete-conflicting-outputs --output web:build

      - name: Fix base href for GitHub Pages 🛠️
        run: |
          # Insere a tag <base href="/portal_servicos/"> logo após a tag <head>
          sed -i 's/<head>/<head>\n  <base href="\/portal_servicos\/">/' build/index.html

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
